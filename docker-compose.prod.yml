# Production stack: nginx → (frontend, backend) → external postgres + redis.
# Postgres and Redis are managed separately in Coolify — supply connection details via env vars.
# The backend joins the `coolify` network so it can reach Coolify-managed postgres/redis containers by hostname.
# Usage: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
services:
  zyntral-api:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:?set DB_URL e.g. jdbc:postgresql://host:5432/zyntral}
      DB_USER: ${DB_USER:?set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST:?set REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?set CRYPTO_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://zyntralai.com}
      WEB_URL: ${WEB_URL:-https://zyntralai.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
    networks:
      - default
      - coolify
    restart: unless-stopped

  zyntral-web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    environment:
      NODE_ENV: production
    depends_on:
      - zyntral-api
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    depends_on:
      - zyntral-web
      - zyntral-api
    restart: unless-stopped

networks:
  coolify:
    external: true
