# Local development stack. Production compose lives in infra/ (separate, hardened).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zyntral
      POSTGRES_USER: zyntral
      POSTGRES_PASSWORD: zyntral
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyntral -d zyntral"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SMTP catcher for local email testing (verification / reset mails)
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

volumes:
  pgdata:
  redisdata:
