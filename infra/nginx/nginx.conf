worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # basic rate limiting for the API surface
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    upstream frontend { server frontend:3000; }
    upstream backend  { server backend:8080; }

    server {
        listen 80;
        server_name _;
        client_max_body_size 25m;

        # security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # --- REST API ---
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- API docs (internal) ---
        location /v3/api-docs { proxy_pass http://backend; }
        location /swagger-ui  { proxy_pass http://backend; }

        # --- health (proxied for external probes) ---
        location /actuator/health { proxy_pass http://backend; }

        # --- Next.js frontend (SSR + static) ---
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;   # HMR / websockets
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
